<svg xmlns="http://www.w3.org/2000/svg" width="980" height="340" viewBox="0 0 980 340">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070b14"/>
    <stop offset=".45" stop-color="#0a1020"/>
    <stop offset="1" stop-color="#0c0a14"/>
  </linearGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset=".38" stop-color="#d8e9ff"/>
    <stop offset=".68" stop-color="#b9b9ff"/>
    <stop offset="1" stop-color="#ffd59a"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4da3ff"/>
    <stop offset=".35" stop-color="#8b7cff"/>
    <stop offset=".7" stop-color="#ff8fb2"/>
    <stop offset="1" stop-color="#f4c46c"/>
  </linearGradient>
  <radialGradient id="blueGlow"><stop stop-color="#3f8cff" stop-opacity=".24"/><stop offset="1" stop-color="#3f8cff" stop-opacity="0"/></radialGradient>
  <radialGradient id="violetGlow"><stop stop-color="#8b5cf6" stop-opacity=".20"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  <radialGradient id="goldGlow"><stop stop-color="#f4b85a" stop-opacity=".16"/><stop offset="1" stop-color="#f4b85a" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
    <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
  </pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<rect width="980" height="340" rx="24" fill="url(#bg)"/>
<rect width="980" height="340" rx="24" fill="url(#grid)"/>

<!-- animated aurora -->
<ellipse cx="760" cy="48" rx="245" ry="180" fill="url(#blueGlow)">
  <animate attributeName="cx" values="720;815;720" dur="8s" repeatCount="indefinite"/>
</ellipse>
<ellipse cx="835" cy="250" rx="220" ry="170" fill="url(#violetGlow)">
  <animate attributeName="cy" values="245;205;245" dur="7s" repeatCount="indefinite"/>
</ellipse>
<ellipse cx="950" cy="290" rx="190" ry="145" fill="url(#goldGlow)">
  <animate attributeName="cx" values="930;880;930" dur="9s" repeatCount="indefinite"/>
</ellipse>

<rect x="1" y="1" width="978" height="338" rx="23" fill="none" stroke="#283344"/>
<rect x="20" y="19" width="940" height="1.5" rx="1" fill="url(#edge)" opacity=".7"/>

<!-- chrome -->
<circle cx="28" cy="38" r="4" fill="#374250"/>
<circle cx="42" cy="38" r="4" fill="#536172"/>
<circle cx="56" cy="38" r="4" fill="#f4c46c"/>
<text x="75" y="42" fill="#738196" font-size="10" font-family="Consolas, monospace">backend.control-plane</text>
<circle cx="884" cy="38" r="4" fill="#67e8b4" filter="url(#glow)">
  <animate attributeName="opacity" values="1;.3;1" dur="1.7s" repeatCount="indefinite"/>
</circle>
<text x="897" y="42" fill="#738196" font-size="9" font-family="Consolas, monospace">ONLINE</text>

<!-- identity -->
<text x="48" y="92" fill="#7ec1ff" font-size="11" font-weight="700" font-family="Consolas, monospace" letter-spacing="2.4">BACKEND WEB DEVELOPER</text>
<text x="48" y="155" fill="url(#name)" font-size="49" font-weight="850" font-family="Segoe UI, Arial, sans-serif" letter-spacing="-1.8">NGUYEN CONG TOAN</text>
<rect x="48" y="169" width="410" height="2" rx="1" fill="url(#edge)"/>
<text x="48" y="205" fill="#b4bfd0" font-size="16" font-family="Segoe UI, Arial, sans-serif">APIs · Databases · Business Logic · Reliable Systems</text>
<text x="48" y="236" fill="#78879a" font-size="11" font-family="Consolas, monospace">PHP   /   JAVA   /   JAVASCRIPT   /   SQL</text>

<g transform="translate(48 260)">
  <rect width="292" height="42" rx="21" fill="#0b121d" stroke="#35506c"/>
  <circle cx="20" cy="21" r="4" fill="#67e8b4" filter="url(#glow)"/>
  <text x="35" y="25" fill="#dbe8f4" font-size="10" font-weight="700" font-family="Consolas, monospace">OPEN TO INTERNSHIP / FRESHER</text>
</g>

<!-- right visual: request constellation -->
<text x="614" y="88" fill="#8e9bb0" font-size="9" font-family="Consolas, monospace" letter-spacing="1.7">LIVE REQUEST CONSTELLATION</text>
<circle cx="786" cy="184" r="112" fill="none" stroke="#57647a" stroke-opacity=".12"/>
<circle cx="786" cy="184" r="76" fill="none" stroke="#57647a" stroke-opacity=".10" stroke-dasharray="3 7"/>

<path id="r1" d="M625 187 C674 187 700 132 742 132" fill="none" stroke="#42607d" stroke-width="1.2"/>
<path id="r2" d="M802 132 C846 132 858 170 900 184" fill="none" stroke="#614f75" stroke-width="1.2"/>
<path id="r3" d="M900 205 C858 218 845 247 802 247" fill="none" stroke="#5e533c" stroke-width="1.2"/>
<path id="r4" d="M742 247 C702 247 682 203 625 203" fill="none" stroke="#355f55" stroke-width="1.2"/>

<g transform="translate(592 166)">
  <rect width="82" height="50" rx="13" fill="#0c131d" stroke="#36516a"/>
  <text x="20" y="30" fill="#cbe7ff" font-size="10" font-weight="700" font-family="Consolas, monospace">CLIENT</text>
</g>
<g transform="translate(741 107)">
  <rect width="88" height="50" rx="13" fill="#0d1420" stroke="#4775a4"/>
  <text x="34" y="30" fill="#6eb6ff" font-size="10" font-weight="700" font-family="Consolas, monospace">API</text>
</g>
<g transform="translate(857 166)">
  <rect width="92" height="50" rx="13" fill="#120f17" stroke="#7c5972"/>
  <text x="16" y="30" fill="#ffb5cc" font-size="10" font-weight="700" font-family="Consolas, monospace">SERVICE</text>
</g>
<g transform="translate(741 222)">
  <rect width="88" height="50" rx="13" fill="#0b1515" stroke="#3c7466"/>
  <text x="18" y="30" fill="#73e4bd" font-size="10" font-weight="700" font-family="Consolas, monospace">DATABASE</text>
</g>

<circle r="4" fill="#58a6ff" filter="url(#glow)">
  <animateMotion dur="2s" repeatCount="indefinite"><mpath href="#r1"/></animateMotion>
</circle>
<circle r="4" fill="#b995ff" filter="url(#glow)">
  <animateMotion dur="2s" begin=".5s" repeatCount="indefinite"><mpath href="#r2"/></animateMotion>
</circle>
<circle r="4" fill="#f4c46c" filter="url(#glow)">
  <animateMotion dur="2s" begin="1s" repeatCount="indefinite"><mpath href="#r3"/></animateMotion>
</circle>
<circle r="4" fill="#67e8b4" filter="url(#glow)">
  <animateMotion dur="2s" begin="1.5s" repeatCount="indefinite"><mpath href="#r4"/></animateMotion>
</circle>

<!-- scan line -->
<rect x="580" y="84" width="360" height="1" fill="#7ebfff" opacity=".18">
  <animate attributeName="y" values="84;284;84" dur="6s" repeatCount="indefinite"/>
</rect>

<text x="615" y="306" fill="#536274" font-size="8" font-family="Consolas, monospace">BUILD → TEST → SHIP → IMPROVE</text>
</svg>
