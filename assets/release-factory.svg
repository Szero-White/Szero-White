<svg xmlns="http://www.w3.org/2000/svg" width="980" height="180" viewBox="0 0 980 180">
<style>
.bg{fill:#090d12}.machine{fill:#0d141a;stroke:#34404b}.t{fill:#8a97a4;font:12px 'Courier New',monospace}
.belt{animation:belt 1s linear infinite}.pkg{animation:ship 4s cubic-bezier(.6,.05,.35,1) infinite}
@keyframes belt{to{transform:translateX(22px)}}
@keyframes ship{0%{transform:translateX(0);fill:#66b3ff}42%{transform:translateX(330px);fill:#8a7dff}72%{transform:translateX(560px);fill:#f2c879}100%{transform:translateX(790px);fill:#7dd3a8}}
</style>
<defs><pattern id="bp" width="22" height="16" patternUnits="userSpaceOnUse"><rect width="13" height="16" fill="#202a34"/><rect x="13" width="9" height="16" fill="#111820"/></pattern></defs>
<rect width="980" height="180" rx="18" class="bg"/><rect x="1" y="1" width="978" height="178" rx="17" fill="none" stroke="#20262d"/>
<text x="28" y="34" class="t" fill="#f2c879">RELEASE FACTORY</text>
<g class="belt"><rect x="-20" y="129" width="1020" height="16" rx="8" fill="url(#bp)"/></g>
<g><rect x="65" y="70" width="95" height="55" rx="9" class="machine"/><text x="92" y="103" class="t">BUILD</text></g>
<g><rect x="395" y="70" width="95" height="55" rx="9" class="machine"/><text x="429" y="103" class="t">TEST</text></g>
<g><rect x="725" y="70" width="95" height="55" rx="9" class="machine"/><text x="758" y="103" class="t">PROD</text></g>
<rect x="100" y="123" width="22" height="22" rx="5" class="pkg"/>
</svg>