<svg xmlns="http://www.w3.org/2000/svg" width="980" height="205" viewBox="0 0 980 205">
<style>
.bg{fill:#090d12}.srv{fill:#0d141a;stroke:#34404b}.t{fill:#8a97a4;font:12px 'Courier New',monospace}
.err{animation:incident 6s steps(1,end) infinite}
@keyframes incident{
0%,16%{fill:#ff8c9a;filter:drop-shadow(0 0 7px #ff8c9a)}
17%,33%{fill:#66b3ff;filter:drop-shadow(0 0 7px #66b3ff)}
34%,50%{fill:#f2c879;filter:drop-shadow(0 0 7px #f2c879)}
51%,67%{fill:#7dd3a8;filter:drop-shadow(0 0 7px #7dd3a8)}
68%,84%{fill:#8a7dff;filter:drop-shadow(0 0 7px #8a7dff)}
85%,100%{fill:#ff8c9a;filter:drop-shadow(0 0 7px #ff8c9a)}
}
</style>
<rect width="980" height="205" rx="18" class="bg"/><rect x="1" y="1" width="978" height="203" rx="17" fill="none" stroke="#20262d"/>
<text x="28" y="34" class="t" fill="#f2c879">500 HUNT · ONE SERVICE IS UNHAPPY</text>
<g transform="translate(60 70)"><rect width="120" height="50" rx="10" class="srv"/><circle cx="17" cy="16" r="4" class="err"/><text x="38" y="31" class="t">API-01</text></g>
<g transform="translate(215 70)"><rect width="120" height="50" rx="10" class="srv"/><circle cx="17" cy="16" r="4" fill="#7dd3a8"/><text x="38" y="31" class="t">API-02</text></g>
<g transform="translate(370 70)"><rect width="120" height="50" rx="10" class="srv"/><circle cx="17" cy="16" r="4" fill="#7dd3a8"/><text x="38" y="31" class="t">AUTH</text></g>
<g transform="translate(525 70)"><rect width="120" height="50" rx="10" class="srv"/><circle cx="17" cy="16" r="4" fill="#7dd3a8"/><text x="38" y="31" class="t">CACHE</text></g>
<g transform="translate(680 70)"><rect width="120" height="50" rx="10" class="srv"/><circle cx="17" cy="16" r="4" fill="#7dd3a8"/><text x="38" y="31" class="t">DB-01</text></g>
<g transform="translate(835 70)"><rect width="100" height="50" rx="10" class="srv"/><circle cx="17" cy="16" r="4" fill="#7dd3a8"/><text x="38" y="31" class="t">WORKER</text></g>
<text x="60" y="164" class="t" fill="#6f7d8b">watch the incident light move · logs would tell the rest of the story</text>
</svg>