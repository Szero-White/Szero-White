<svg xmlns="http://www.w3.org/2000/svg" width="980" height="400" viewBox="0 0 980 400">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d15"/><stop offset=".55" stop-color="#0b1120"/><stop offset="1" stop-color="#120c16"/></linearGradient>
  <radialGradient id="g1"><stop stop-color="#4da3ff" stop-opacity=".14"/><stop offset="1" stop-color="#4da3ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="g2"><stop stop-color="#ff8fb2" stop-opacity=".10"/><stop offset="1" stop-color="#ff8fb2" stop-opacity="0"/></radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="980" height="400" rx="22" fill="url(#bg)"/>
<circle cx="760" cy="180" r="240" fill="url(#g1)"/>
<circle cx="930" cy="345" r="180" fill="url(#g2)"/>
<rect x="1" y="1" width="978" height="398" rx="21" fill="none" stroke="#273240"/>

<text x="34" y="48" fill="#f4c46c" font-size="10" font-weight="700" font-family="Consolas, monospace" letter-spacing="1.8">BACKEND BUDDY / NIGHT SHIFT</text>
<text x="34" y="91" fill="#f8fafc" font-size="30" font-weight="850" font-family="Segoe UI, Arial, sans-serif">The tiny teammate nobody assigned.</text>
<text x="34" y="121" fill="#8b99aa" font-size="13" font-family="Segoe UI, Arial, sans-serif">Still checking logs. Still routing requests. Still refusing to admit</text>
<text x="34" y="143" fill="#8b99aa" font-size="13" font-family="Segoe UI, Arial, sans-serif">that coffee might be a runtime dependency.</text>

<!-- status stack -->
<g transform="translate(34 174)">
  <rect width="280" height="42" rx="21" fill="#0a121b" stroke="#304154"/>
  <circle cx="20" cy="21" r="4" fill="#67e8b4" filter="url(#glow)"><animate attributeName="opacity" values="1;.3;1" dur="1.7s" repeatCount="indefinite"/></circle>
  <text x="35" y="25" fill="#c2ceda" font-size="9.5" font-family="Consolas, monospace">handling requests · 200 OK</text>
</g>
<g transform="translate(34 229)">
  <rect width="220" height="34" rx="17" fill="#0a121b" stroke="#3b3150"/>
  <circle cx="18" cy="17" r="3" fill="#a98bff"/>
  <text x="31" y="21" fill="#8f9cac" font-size="8.7" font-family="Consolas, monospace">queue depth: 04</text>
</g>
<g transform="translate(34 274)">
  <rect width="220" height="34" rx="17" fill="#0a121b" stroke="#51412b"/>
  <circle cx="18" cy="17" r="3" fill="#f4c46c"/>
  <text x="31" y="21" fill="#8f9cac" font-size="8.7" font-family="Consolas, monospace">coffee level: critical</text>
</g>

<!-- floating packet pets -->
<path id="pet1" d="M320 330 C420 270 470 305 545 220 C620 135 715 120 940 212" fill="none" stroke="#344252" stroke-width="1" stroke-dasharray="5 7"/>
<g>
  <rect x="-18" y="-18" width="36" height="36" rx="12" fill="#10223a" stroke="#58a6ff"/>
  <circle cx="-7" cy="-5" r="2.4" fill="#fff"/><circle cx="7" cy="-5" r="2.4" fill="#fff"/>
  <text x="-10" y="10" fill="#7ec1ff" font-size="7" font-weight="800" font-family="Consolas, monospace">GET</text>
  <animateMotion dur="7s" repeatCount="indefinite"><mpath href="#pet1"/></animateMotion>
</g>

<!-- desk -->
<rect x="580" y="328" width="300" height="15" rx="7" fill="#222d38"/>
<rect x="604" y="341" width="9" height="45" rx="4" fill="#151b22"/>
<rect x="846" y="341" width="9" height="45" rx="4" fill="#151b22"/>

<!-- bot -->
<g>
  <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="3.1s" repeatCount="indefinite"/>
  <line x1="730" y1="89" x2="730" y2="106" stroke="#617186"/>
  <circle cx="730" cy="84" r="5" fill="#f4c46c" filter="url(#glow)"><animate attributeName="opacity" values="1;.25;1" dur="1.5s" repeatCount="indefinite"/></circle>
  <rect x="680" y="105" width="100" height="80" rx="28" fill="#1a2532" stroke="#60748a"/>
  <rect x="694" y="120" width="72" height="49" rx="16" fill="#060a0f" stroke="#2b3948"/>
  <ellipse cx="713" cy="145" rx="5.5" ry="7.5" fill="#74c4ff" filter="url(#glow)">
    <animate attributeName="ry" values="7.5;7.5;1;7.5;7.5" keyTimes="0;.45;.47;.49;1" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="747" cy="145" rx="5.5" ry="7.5" fill="#b28cff" filter="url(#glow)">
    <animate attributeName="ry" values="7.5;7.5;1;7.5;7.5" keyTimes="0;.45;.47;.49;1" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  <path d="M721 159 Q730 166 739 159" fill="none" stroke="#f4c46c" stroke-width="2"/>
  <rect x="696" y="190" width="68" height="52" rx="15" fill="#141f2b" stroke="#44566a"/>
  <text x="714" y="220" fill="#7ec1ff" font-size="12" font-weight="800" font-family="Consolas, monospace">&lt;/&gt;</text>
  <line x1="701" y1="207" x2="659" y2="229" stroke="#263746" stroke-width="9" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="0 701 207;9 701 207;0 701 207" dur=".75s" repeatCount="indefinite"/>
  </line>
  <line x1="759" y1="207" x2="801" y2="229" stroke="#263746" stroke-width="9" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="0 759 207;-9 759 207;0 759 207" dur=".75s" repeatCount="indefinite"/>
  </line>
</g>

<!-- laptop -->
<rect x="643" y="249" width="176" height="89" rx="10" fill="#101821" stroke="#405064"/>
<rect x="654" y="260" width="154" height="63" rx="6" fill="#05090d"/>
<text x="665" y="276" fill="#66b6ff" font-size="8.5" font-family="Consolas, monospace">GET</text>
<text x="692" y="276" fill="#6f7e91" font-size="8.5" font-family="Consolas, monospace">/api/profile</text>
<text x="776" y="276" fill="#6ee7b7" font-size="8.5" font-family="Consolas, monospace">200</text>
<text x="665" y="291" fill="#b28cff" font-size="8.5" font-family="Consolas, monospace">POST</text>
<text x="696" y="291" fill="#6f7e91" font-size="8.5" font-family="Consolas, monospace">/session</text>
<text x="776" y="291" fill="#6ee7b7" font-size="8.5" font-family="Consolas, monospace">201</text>
<text x="665" y="306" fill="#f4c46c" font-size="8.5" font-family="Consolas, monospace">db.query</text>
<text x="710" y="306" fill="#6f7e91" font-size="8.5" font-family="Consolas, monospace">('skills')</text>
<text x="779" y="306" fill="#6ee7b7" font-size="8.5" font-family="Consolas, monospace">✓</text>

<!-- coffee -->
<rect x="835" y="294" width="31" height="31" rx="6" fill="#18120d" stroke="#6f5737"/>
<path d="M866 302 Q881 302 881 310 Q881 318 866 318" fill="none" stroke="#6f5737"/>
<path d="M844 291 Q839 278 845 267" fill="none" stroke="#f4c46c" stroke-opacity=".6">
  <animate attributeName="opacity" values="0;.7;0" dur="2s" repeatCount="indefinite"/>
  <animateTransform attributeName="transform" type="translate" values="0 5;4 -9" dur="2s" repeatCount="indefinite"/>
</path>
<path d="M856 291 Q862 276 855 264" fill="none" stroke="#ff9cb9" stroke-opacity=".5">
  <animate attributeName="opacity" values="0;.65;0" dur="2s" begin=".6s" repeatCount="indefinite"/>
  <animateTransform attributeName="transform" type="translate" values="0 5;-4 -9" dur="2s" begin=".6s" repeatCount="indefinite"/>
</path>

<text x="34" y="358" fill="#566476" font-size="9" font-family="Consolas, monospace">tiny services, serious responsibilities.</text>
</svg>