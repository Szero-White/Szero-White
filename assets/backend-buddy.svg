<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360">
<style>
  .bg{fill:#090d12}.panel{fill:#0d1219;stroke:#26313c;stroke-width:1}
  .muted{fill:#7c8996;font:14px 'Segoe UI',sans-serif}
  .mono{font-family:'Courier New',monospace}
  .title{fill:#f7f2e8;font:bold 28px 'Segoe UI',sans-serif}
  .gold{fill:#f2c879}.blue{fill:#66b3ff}.green{fill:#7dd3a8}
  .eye{fill:#8dccff;filter:url(#glow)}
  .blink{animation:blink 4.2s infinite;transform-origin:center}
  .bot{animation:float 3.2s ease-in-out infinite}
  .armL{animation:typeL .7s ease-in-out infinite alternate;transform-origin:620px 205px}
  .armR{animation:typeR .7s ease-in-out infinite alternate;transform-origin:694px 205px}
  .scan{animation:scan 3s linear infinite}
  .steam1{animation:steam 2.1s ease-in-out infinite}
  .steam2{animation:steam 2.1s .7s ease-in-out infinite}
  .packet{animation:route 7s cubic-bezier(.45,.05,.55,.95) infinite}
  .code{animation:code 3.8s linear infinite}
  @keyframes blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.08)}}
  @keyframes float{50%{transform:translateY(-6px)}}
  @keyframes typeL{to{transform:rotate(11deg)}}
  @keyframes typeR{to{transform:rotate(-11deg)}}
  @keyframes scan{from{transform:translateY(0)}to{transform:translateY(68px)}}
  @keyframes steam{0%{opacity:0;transform:translateY(8px)}35%{opacity:.65}100%{opacity:0;transform:translate(5px,-16px)}}
  @keyframes route{0%{transform:translate(-80px,230px) rotate(-6deg)}24%{transform:translate(160px,70px) rotate(5deg)}52%{transform:translate(470px,40px) rotate(-4deg)}78%{transform:translate(740px,115px) rotate(5deg)}100%{transform:translate(980px,220px)}}
  @keyframes code{0%,18%{transform:translateY(0)}80%,100%{transform:translateY(-22px)}}
</style>
<defs>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <linearGradient id="botg" x1="0" x2="1"><stop stop-color="#202b37"/><stop offset="1" stop-color="#0e141c"/></linearGradient>
  <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#28323d"/><stop offset="1" stop-color="#151b22"/></linearGradient>
</defs>
<rect width="980" height="360" rx="20" class="bg"/>
<rect x="1" y="1" width="978" height="358" rx="19" fill="none" stroke="#20262d"/>
<line x1="0" y1="44" x2="980" y2="44" stroke="#20262d"/>
<circle cx="20" cy="22" r="4" fill="#313b46"/><circle cx="34" cy="22" r="4" fill="#313b46"/><circle cx="48" cy="22" r="4" fill="#f2c879"/>
<text x="66" y="26" class="muted mono" font-size="11">backend-buddy.live</text>
<text x="842" y="26" class="muted mono" font-size="11">NIGHT SHIFT · ONLINE</text>

<text x="48" y="105" class="gold mono" font-size="12" font-weight="700">BACKEND BUDDY / ACTIVE</text>
<text x="48" y="148" class="title">Meet the quiet one</text>
<text x="48" y="180" class="title">behind the requests.</text>
<text x="48" y="215" class="muted">A tiny desk, a running terminal, one very committed coffee cup,</text>
<text x="48" y="238" class="muted">and a queue that somehow never stops arriving.</text>
<rect x="48" y="270" width="255" height="34" rx="17" class="panel"/>
<circle cx="66" cy="287" r="4" class="green" filter="url(#glow)"/>
<text x="80" y="292" class="muted mono" font-size="11">currently: handling requests</text>

<g class="packet">
  <rect x="0" y="0" width="38" height="38" rx="13" fill="#10243a" stroke="#66b3ff"/>
  <circle cx="12" cy="13" r="2.5" fill="#eaf6ff"/><circle cx="26" cy="13" r="2.5" fill="#eaf6ff"/>
  <text x="9" y="29" class="blue mono" font-size="8" font-weight="700">GET</text>
</g>

<g transform="translate(660 115)" class="bot">
  <line x1="0" y1="-18" x2="0" y2="0" stroke="#536173"/>
  <circle cx="0" cy="-21" r="5" class="gold" filter="url(#glow)"/>
  <rect x="-42" y="0" width="84" height="66" rx="24" fill="url(#botg)" stroke="#536173"/>
  <rect x="-31" y="12" width="62" height="43" rx="14" fill="#070b10" stroke="#27333f"/>
  <g class="blink">
    <ellipse cx="-15" cy="31" rx="5" ry="7" class="eye"/>
    <ellipse cx="15" cy="31" rx="5" ry="7" class="eye"/>
  </g>
  <path d="M-8 45 Q0 51 8 45" fill="none" stroke="#f2c879" stroke-width="2"/>
  <rect x="-29" y="69" width="58" height="44" rx="13" fill="#141c25" stroke="#3f4d5c"/>
  <text x="-13" y="95" class="blue mono" font-size="12" font-weight="700">&lt;/&gt;</text>
  <line x1="-26" y1="81" x2="-62" y2="94" stroke="#202b36" stroke-width="8" stroke-linecap="round" class="armL"/>
  <line x1="26" y1="81" x2="62" y2="94" stroke="#202b36" stroke-width="8" stroke-linecap="round" class="armR"/>
</g>

<rect x="585" y="226" width="150" height="93" rx="9" fill="#111821" stroke="#3a4653"/>
<rect x="595" y="236" width="130" height="69" rx="5" fill="#070b10"/>
<g clip-path="url(#clipCode)" class="code mono" font-size="9">
  <text x="604" y="251" class="blue">GET</text><text x="632" y="251" fill="#667481"> /api/profile </text><text x="696" y="251" class="green">200</text>
  <text x="604" y="268" class="blue">POST</text><text x="632" y="268" fill="#667481"> /session </text><text x="696" y="268" class="green">201</text>
  <text x="604" y="285" fill="#667481">db.query(</text><text x="654" y="285" class="gold">'skills'</text><text x="697" y="285" fill="#667481">)</text>
  <text x="604" y="302" fill="#667481">cache.hit = </text><text x="672" y="302" class="green">true</text>
  <text x="604" y="319" class="blue">GET</text><text x="632" y="319" fill="#667481"> /coffee </text><text x="696" y="319" class="gold">202</text>
</g>
<defs><clipPath id="clipCode"><rect x="595" y="236" width="130" height="69" rx="5"/></clipPath></defs>

<rect x="548" y="315" width="230" height="14" rx="7" fill="url(#desk)"/>
<rect x="568" y="326" width="10" height="30" rx="4" fill="#151b22"/><rect x="748" y="326" width="10" height="30" rx="4" fill="#151b22"/>

<rect x="760" y="283" width="28" height="28" rx="5" fill="#17130d" stroke="#5e4f36"/>
<path d="M788 290 q13 0 13 9 q0 9 -13 9" fill="none" stroke="#5e4f36"/>
<path d="M768 278 q-5 -11 1 -18" fill="none" stroke="#f2c879" class="steam1"/>
<path d="M779 278 q5 -12 0 -21" fill="none" stroke="#f2c879" class="steam2"/>
</svg>